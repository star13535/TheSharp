<!DOCTYPE html>
<html lang="ko">
<head>
    <meta property="og:type" content="website">
    <meta property="og:title" content="더샵 오산역아크시티 - 김종직 팀장">
    <meta property="og:description" content="세교2지구 유일 슬세권! 오산 최고층 랜드마크 단지 상담 연결">
    <meta property="og:image" content="https://star13535.github.io/TheSharp/img/KJJ.JPG">    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>더샵 오산역아크시티 - 김종직 팀장</title>
    
    <link rel="icon" href="img/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">

    <style>
        /* [공통 설정] */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8f9fa; color: #333; text-align: center; padding-bottom: 120px; }
        img { width: 100%; height: auto; display: block; vertical-align: middle; }

        /* [1. 인트로 팝업] */
        .intro-popup-container { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; 
            background: rgba(0, 0, 0, 0.75); z-index: 10000; align-items: center; justify-content: center; padding: 15px;
        }
        .intro-popup-content { position: relative; width: 95%; max-width: 450px; animation: fadeInScale 0.6s ease-out forwards; opacity: 0; }
        @keyframes fadeInScale { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .pop-close-x { position: absolute; top: 15px; right: 15px; width: 30px; height: 30px; cursor: pointer; background: rgba(0,0,0,0.5); border-radius: 50%; color: #fff; line-height: 30px; font-weight: bold; }

        /* [2. 명함 섹션 (좌/우)] */
        .business-card { width: 100%; background: #fff; padding: 20px; border-bottom: 1px solid #eee; }
        .card-container { width: 100%; max-width: 330px; margin: 0 auto; }
        .card-container img { border-radius: 12px; box-shadow: 0 6px 15px rgba(0,0,0,0.1); }
        .card-btn-call { display: block; margin-top: 15px; padding: 12px 0; background: #003a78; color: #fff; text-decoration: none; border-radius: 8px; font-size: 16px; font-weight: bold; }

        /* [3. 타이틀 & 상단 대칭 로고/명함] */
        .main-title { 
            background-color: #fff; padding: 50px 20px; position: relative; 
            display: flex; align-items: center; justify-content: center; min-height: 180px; overflow: hidden;
        }
        .side-img { display: none; position: absolute; top: 50%; transform: translateY(-50%); height: 140px; z-index: 1; }
        .inner-logo { left: 40px; } /* 왼쪽 로고 */
        .inner-card { right: 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); } /* 오른쪽 명함 */

        .main-title h2 { font-size: 28px; color: #003a78; font-weight: 700; letter-spacing: -1px; line-height: 1.2; word-break: keep-all; position: relative; z-index: 2; }
        .main-title p { font-size: 16px; color: #666; margin-top: 10px; word-break: keep-all; position: relative; z-index: 2; }

        /* [4. 강조된 전화번호 배너] */
        .point-banner { 
            background: #003a78; color: #fff; padding: 20px; font-size: 24px; font-weight: bold; 
            border-top: 3px solid #ffcc00; border-bottom: 3px solid #ffcc00;
            text-shadow: 0 0 10px rgba(255,204,0,0.5);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { background-color: #003a78; }
            50% { background-color: #004da1; }
            100% { background-color: #003a78; }
        }

        /* [5. 메인 탭 & 콘텐츠] */
        .tab-menu { display: flex; position: sticky; top: 0; z-index: 2000; background: #fff; border-bottom: 2px solid #003a78; }
        .tab-btn { flex: 1; padding: 15px 5px; border: none; background: #fff; font-size: 16px; font-weight: bold; color: #666; cursor: pointer; border-right: 1px solid #eee; }
        .tab-btn.active { background: #003a78; color: #fff; }
        .tab-content { display: none; width: 100%; max-width: 1100px; margin: 0 auto; background: #fff; }
        .tab-content.active { display: block !important; }

        /* [6. 서브 필터 (세대안내 등)] */
        .view-mode-selector { display: flex; background: #eee; padding: 10px; position: sticky; top: 52px; z-index: 1500; }
        .mode-btn { flex: 1; padding: 12px; border: none; background: #ddd; font-weight: bold; color: #888; border-radius: 6px; margin: 0 5px; }
        .mode-btn.active { background: #003a78; color: #fff; }
        .size-filter, .type-group.active { position: sticky; top: 120px; z-index: 1000; background: #fff; padding: 10px; }
        .filter-btn, .sub-tab-btn { padding: 10px 15px; border: 1px solid #003a78; background: #fff; color: #003a78; border-radius: 4px; font-weight: bold; cursor: pointer; margin: 3px; }
        .filter-btn.active, .sub-tab-btn.active { background: #003a78; color: #fff; }
        .sub-tab-content { display: none; }
        .sub-tab-content.active { display: block !important; }

        /* [7. PC 전용 레이아웃] */
        @media (min-width: 1024px) {
            .side-img { display: block; } /* PC에서만 상단 양쪽 이미지 노출 */
            .business-card { position: fixed; top: 60%; width: 300px; border: 2px solid #003a78; border-radius: 20px; z-index: 1100; padding: 15px; }
            #card-left { left: 30px; }
            #card-right { right: 30px; }
            .main-title h2 { font-size: 42px; }
            .main-title p { font-size: 20px; }
        }

        /* [8. 모바일 하단 명함 나란히 배치] */
        @media (max-width: 1023px) {
            .mobile-footer-cards { display: flex; gap: 10px; padding: 10px; background: #f1f1f1; }
            .mobile-footer-cards .business-card { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #ddd; }
            .mobile-footer-cards .card-btn-call { font-size: 14px; padding: 8px 0; }
        }
    </style>
</head>
<body>

    <div class="main-title">
        <img src="img/logo3.png" class="side-img inner-logo" alt="로고">
        <div class="title-text">
            <h2>더샵 오산역아크시티</h2>
            <p>세교2지구 유일한 슬세권, 오산 최고층 랜드마크</p>
        </div>
        <img src="img/KJJ.JPG" class="side-img inner-card" alt="명함">
    </div>
    
    <div class="point-banner">
        ✨ 김종직 팀장 : <a href="tel:01065966692" style="color: #ffcc00; text-decoration: none;">010-6596-6692</a> ✨
    </div>

    <div class="business-card" id="card-left">
        <div class="card-container">
            <img src="img/KJJ.JPG" alt="명함">
            <a href="tel:01065966692" class="card-btn-call">📞 상담 연결 (좌)</a>
        </div>
    </div>

    <div class="business-card" id="card-right">
        <div class="card-container">
            <img src="img/KJJ.JPG" alt="명함">
            <a href="tel:01065966692" class="card-btn-call">📞 상담 연결 (우)</a>
        </div>
    </div>

    <div class="intro-popup-container" id="introPopup">
        <div class="intro-popup-content">
            <i class="pop-close-x" id="popClose">X</i>
            <img src="img/popup.jpg" alt="특별 분양 광고">
        </div>
    </div>

    <div class="tab-menu">
        <button class="tab-btn active" onclick="openTab(event, 'tab1')">사업개요</button>
        <button class="tab-btn" onclick="openTab(event, 'tab2')">입지안내</button>
        <button class="tab-btn" onclick="openTab(event, 'tab3')">단지&세대안내</button>
    </div>

    <div id="tab1" class="tab-content active"><img src="img/full.jpg"><img src="img/2.png"><img src="img/3.png"><img src="img/4.png"></div>
    <div id="tab2" class="tab-content"><img src="img/9.png"><img src="img/4.png"><img src="img/5.png"><img src="img/6.png"></div>
    <div id="tab3" class="tab-content">
        <div class="view-mode-selector">
            <button class="mode-btn active" onclick="changeViewMode(event, 'photo-view')">🏢 단지 안내</button>
            <button class="mode-btn" onclick="changeViewMode(event, 'plan-view')">🏠 평면도 안내</button>
        </div>
        <div id="photo-view" class="mode-content active">
            <div class="type-group active">
                <button class="sub-tab-btn active" onclick="openSubTab(event, 'danji1', 'photo-view')">투시도/조감도</button>
                <button class="sub-tab-btn" onclick="openSubTab(event, 'danji2', 'photo-view')">단지배치도</button>
            </div>
            <div id="danji1" class="sub-tab-content active"><img src="img/full.jpg"><img src="img/full2.jpg"></div>
            <div id="danji2" class="sub-tab-content"><img src="img/15.png"><img src="img/donghosu.jpg"></div>
        </div>
        <div id="plan-view" class="mode-content">
            <div class="size-filter">
                <button class="filter-btn active" onclick="filterSize(event, 'size84A')">84㎡A</button>
                <button class="filter-btn" onclick="filterSize(event, 'size104')">104㎡A</button>
            </div>
            <div id="size84A" class="sub-tab-content active"><img src="img/84.jpg"></div>
            <div id="size104" class="sub-tab-content"><img src="img/104a.jpg"></div>
        </div>
    </div>

    <script>
        // 팝업 로직 및 기본 스크롤 제어
        window.addEventListener('DOMContentLoaded', function() {
            const pop = document.getElementById('introPopup');
            pop.style.display = 'flex';
            document.getElementById('popClose').onclick = () => pop.style.display = 'none';

            window.onscroll = function() {
                let s = window.pageYOffset || document.documentElement.scrollTop;
                // PC에서 스크롤 시 명함 위치 살짝 조정 애니메이션 효과
                if (window.innerWidth >= 1024) {
                    const cards = document.querySelectorAll('.business-card');
                    cards.forEach(c => {
                        if(s > 100) c.style.top = "50%";
                        else c.style.top = "60%";
                    });
                }
            };
        });

        function openTab(e, t) {
            document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
            document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
            document.getElementById(t).classList.add("active");
            e.currentTarget.classList.add("active");
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function changeViewMode(e, m) {
            document.querySelectorAll('.mode-content, .mode-btn').forEach(x => x.classList.remove('active'));
            document.getElementById(m).classList.add('active');
            if(e) e.currentTarget.classList.add('active');
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function filterSize(e, s) {
            document.querySelectorAll('#plan-view .sub-tab-content, .filter-btn').forEach(x => x.classList.remove('active'));
            document.getElementById(s).classList.add('active');
            e.currentTarget.classList.add('active');
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function openSubTab(e, s, p) {
            const parent = document.getElementById(p);
            parent.querySelectorAll(".sub-tab-content, .sub-tab-btn").forEach(x => x.classList.remove("active"));
            document.getElementById(s).classList.add("active");
            e.currentTarget.classList.add("active");
            window.scrollTo({top: 0, behavior: 'smooth'});
        }
    </script>
</body>
</html>
