<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>더샵 오산역아크시티 - 김종직 팀장</title>
    
    <link rel="icon" href="img/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8f9fa; color: #333; text-align: center; padding-bottom: 100px; }
        img { width: 100%; height: auto; display: block; }

        /* 팝업 */
        .intro-popup-container { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; 
            background: rgba(0, 0, 0, 0.75); z-index: 10000; align-items: center; justify-content: center; padding: 15px;
        }
        .intro-popup-content { 
            position: relative; width: 95%; max-width: 450px; 
            animation: fadeInScale 0.6s ease-out forwards; transform-origin: center; opacity: 0;
        }
        @keyframes fadeInScale {
            0% { transform: translateY(-20px) scale(0.9); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        .intro-popup-content img { border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }

        .pop-close-x { 
            position: absolute; top: 15px; right: 15px; width: 30px; height: 30px; 
            cursor: pointer; z-index: 3; background: rgba(0,0,0,0.5); border-radius: 50%; 
            color: #fff; line-height: 30px; font-weight: bold;
        }

        /* 🔥 3억대 펄스 */
        .price-pulse {
            position: absolute;
            bottom: 95px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 64px;
            font-weight: 900;
            color: #ffd400;
            z-index: 2;
            pointer-events: none;
            animation: pulseGlow 2.4s infinite;
        }

        @keyframes pulseGlow {
            0% {
                transform: translateX(-50%) scale(1);
                text-shadow: 0 0 0 rgba(255,212,0,0);
            }
            50% {
                transform: translateX(-50%) scale(1.06);
                text-shadow: 
                    0 0 20px rgba(255,212,0,0.9),
                    0 0 40px rgba(255,212,0,0.5);
            }
            100% {
                transform: translateX(-50%) scale(1);
                text-shadow: 0 0 0 rgba(255,212,0,0);
            }
        }

        /* 이하 기존 그대로 */
        .business-card { width: 100%; background: #fff; padding: 30px 20px; border-bottom: 1px solid #eee; }
        .card-container { max-width: 330px; margin: 0 auto; }
        .card-btn-call { display: block; margin-top: 15px; padding: 12px; background: #003a78; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; }

        .main-title { background:#fff; padding:50px 20px; display:flex; align-items:center; justify-content:center; }
        .main-title h2 { font-size:36px; color:#003a78; }
        .main-title p { font-size:18px; color:#666; margin-top:10px; }

        .point-banner { background:#003a78; color:#fff; padding:15px; font-weight:bold; }

        .tab-menu { display:flex; background:#fff; position:sticky; top:0; z-index:2000; }
        .tab-btn { flex:1; padding:15px; border:none; background:#fff; font-weight:bold; cursor:pointer; }
        .tab-btn.active { background:#003a78; color:#fff; }

        .tab-content { display:none; max-width:1100px; margin:0 auto; background:#fff; }
        .tab-content.active { display:block; }

        .fixed-footer-call {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(90deg, #002a58, #003a78);
            color: #fff; text-decoration: none; padding: 14px 30px; border-radius: 50px; font-weight: bold; z-index: 9999;
        }
    </style>
</head>
<body>

    <!-- 팝업 -->
    <div class="intro-popup-container" id="introPopup">
        <div class="intro-popup-content">
            <i class="pop-close-x" id="popClose">X</i>

            <!-- 🔥 핵심 추가 -->
            <div class="price-pulse">3억대</div>

            <img src="img/popup.jpg" alt="특별 분양 광고">
        </div>
    </div>

    <div class="business-card">
        <div class="card-container">
            <img src="img/KJJ.JPG">
            <a href="tel:01065966692" class="card-btn-call">📞 김종직 팀장 상담 연결</a>
        </div>
    </div>

    <div class="main-title">
        <div>
            <h2>더샵 오산역아크시티</h2>
            <p>세교2지구 유일한 슬세권</p>
        </div>
    </div>

    <div class="point-banner">김종직 팀장: 010-6596-6692</div>

    <div class="tab-menu">
        <button class="tab-btn active" onclick="openTab(event, 'tab1')">사업개요</button>
        <button class="tab-btn" onclick="openTab(event, 'tab2')">입지안내</button>
    </div>

    <div id="tab1" class="tab-content active">
        <img src="img/full.jpg">
    </div>
    <div id="tab2" class="tab-content">
        <img src="img/9.png">
    </div>

    <a href="tel:01065966692" class="fixed-footer-call">📞 상담 연결</a>

    <script>
        window.addEventListener('DOMContentLoaded', function() {
            const pop = document.getElementById('introPopup');
            pop.style.display = 'flex';

            document.getElementById('popClose').onclick = () => {
                pop.style.display = 'none';
            };

            pop.onclick = (e) => {
                if(e.target === pop) pop.style.display = 'none';
            };
        });

        function openTab(e, t) {
            document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
            document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
            document.getElementById(t).classList.add("active");
            e.currentTarget.classList.add("active");
        }
    </script>

</body>
</html>
