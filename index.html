<div id="tab3" class="tab-content">
    <div class="view-mode-selector">
        <button class="mode-btn active" onclick="changeViewMode(event, 'photo-view')">단지 안내</button>
        <button class="mode-btn" onclick="changeViewMode(event, 'plan-view')">📐 평면도 안내</button>
    </div>

    <div id="photo-view" class="mode-content active" style="display: block;">
        <img src="img/full.jpg" alt="실사진1">
        <img src="img/15.png" alt="실사진2">
        <img src="img/26.png" alt="실사진3">
        <img src="img/donghosu.jpg" alt="실사진4">  
    </div>

    <div id="plan-view" class="mode-content">
        <div class="size-filter">
            <button class="filter-btn active" onclick="filterSize(event, 'group84A')">84㎡A,A-1</button>
            <button class="filter-btn" onclick="filterSize(event, 'group84B')">84㎡B,B-1</button>
            <button class="filter-btn" onclick="filterSize(event, 'group104')">104㎡A</button>
        </div>

        <div id="group84A" class="type-group active">
            <div class="sub-tab-menu">
                <button class="sub-tab-btn active" onclick="openSubTab(event, 'img84A')">84㎡A,A-1</button>
            </div>
        </div>
        <div id="group84B" class="type-group">
            <div class="sub-tab-menu">
                <button class="sub-tab-btn" onclick="openSubTab(event, 'img84B')">84㎡B,B-1</button>
            </div>
        </div>
        <div id="group104" class="type-group">
            <div class="sub-tab-menu">
                <button class="sub-tab-btn" onclick="openSubTab(event, 'img104')">104㎡A</button>
            </div>
        </div>

        <div id="img84A" class="sub-tab-content active" style="display: block;"><img src="img/84.jpg" alt="84A"></div>
        <div id="img84B" class="sub-tab-content" style="display: none;"><img src="img/84B.jpg" alt="84B"></div>
        <div id="img104" class="sub-tab-content" style="display: none;"><img src="img/104a.jpg" alt="104A"></div>
    </div>
</div>

<script>
    /* 기존 스크립트를 아래 내용으로 교체하시면 더 완벽하게 작동합니다 */
    function openTab(evt, tabName) {
        var i, tabcontent, tablinks;
        tabcontent = document.getElementsByClassName("tab-content");
        for (i = 0; i < tabcontent.length; i++) { tabcontent[i].style.display = "none"; }
        tablinks = document.getElementsByClassName("tab-btn");
        for (i = 0; i < tablinks.length; i++) { tablinks[i].classList.remove("active"); }
        document.getElementById(tabName).style.display = "block";
        evt.currentTarget.classList.add("active");
        window.scrollTo(0, 0);
    }

    function changeViewMode(evt, modeId) {
        const contents = document.getElementsByClassName('mode-content');
        for (let content of contents) { 
            content.classList.remove('active'); 
            content.style.display = "none"; // 강제 숨김
        }
        const btns = document.getElementsByClassName('mode-btn');
        for (let btn of btns) { btn.classList.remove('active'); }
        
        const target = document.getElementById(modeId);
        target.classList.add('active');
        target.style.display = "block"; // 강제 표시
        evt.currentTarget.classList.add('active');
    }

    function filterSize(evt, sizeId) {
        const groups = document.getElementsByClassName('type-group');
        for (let group of groups) { group.classList.remove('active'); group.style.display = "none"; }
        const filterBtns = document.getElementsByClassName('filter-btn');
        for (let btn of filterBtns) { btn.classList.remove('active'); }
        
        const target = document.getElementById(sizeId);
        target.classList.add('active');
        target.style.display = "block";
        evt.currentTarget.classList.add('active');

        // 필터 변경 시 해당 이미지도 같이 뜨도록 연결된 서브탭 클릭 시뮬레이션
        const subTabId = sizeId.replace('group', 'img');
        const subContents = document.getElementsByClassName("sub-tab-content");
        for (let content of subContents) { content.style.display = "none"; }
        document.getElementById(subTabId).style.display = "block";
    }

    function openSubTab(evt, subTabName) {
        const subcontents = document.getElementsByClassName("sub-tab-content");
        for (let content of subcontents) { content.style.display = "none"; }
        const subbtns = document.getElementsByClassName("sub-tab-btn");
        for (let btn of subbtns) { btn.classList.remove("active"); }
        document.getElementById(subTabName).style.display = "block";
        evt.currentTarget.classList.add("active");
    }
</script>
