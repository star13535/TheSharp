<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>더샵 오산역아크시티 - 김종직 팀장</title>
    
    <link rel="icon" href="img/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">

    <style>
        /* [공통 설정] */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8f9fa; color: #333; text-align: center; padding-bottom: 100px; }
        img { width: 100%; height: auto; display: block; vertical-align: middle; }

        /* [1. 명함 섹션 - 스크롤 애니메이션 적용] */
        .business-card { width: 100%; background: #fff; padding: 30px 20px; border-bottom: 1px solid #eee; }
        .card-container { width: 100%; max-width: 330px; margin: 0 auto; }
        .card-container img { border-radius: 12px; box-shadow: 0 6px 15px rgba(0,0,0,0.1); }
        .card-btn-call { display: block; margin-top: 15px; padding: 12px 0; background: #003a78; color: #fff; text-decoration: none; border-radius: 8px; font-size: 16px; font-weight: bold; }

        /* [2. 타이틀 & 배너] */
        .main-title { 
            background-color: #fff; padding: 50px 20px; position: relative; 
            display: flex; align-items: center; justify-content: center; min-height: 180px; 
        }
        .main-title .inner-logo { display: none; }
        .main-title .title-text { width: 100%; z-index: 2; }
        .main-title h2 { font-size: 36px; color: #003a78; font-weight: 700; letter-spacing: -1.5px; line-height: 1.2; word-break: keep-all; }
        .main-title p { font-size: 19px; color: #666; margin-top: 12px; }
        .point-banner { background: #003a78; color: #fff; padding: 15px; font-size: 20px; font-weight: bold; }

        /* [3. 메인 탭 메뉴 - 고정] */
        .tab-menu { 
            display: flex; flex-wrap: wrap; justify-content: center; background: #fff; 
            position: sticky; top: 0; z-index: 2000; border-bottom: 2px solid #003a78; 
        }
        .tab-btn { flex: 1; min-width: 20%; padding: 15px 5px; border: none; background: #fff; font-size: 16px; font-weight: bold; color: #666; cursor: pointer; border-right: 1px solid #eee; }
        .tab-btn.active { background: #003a78; color: #fff; }

        /* [4. 탭 콘텐츠 공통] */
        .tab-content { display: none; width: 100%; max-width: 1100px; margin: 0 auto; background: #fff; }
        .tab-content.active { display: block !important; }

        /* [7. 하단 고정 버튼] */
        .fixed-footer-call {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            width: auto; min-width: 300px; background: linear-gradient(90deg, #002a58, #003a78);
            color: #fff; text-decoration: none; padding: 14px 30px; font-size: 18px; font-weight: bold; z-index: 9999;
            text-align: center; border-radius: 50px; box-shadow: 0 8px 20px rgba(0,0,0,0.25);
        }

        @media (min-width: 1024px) {
            /* [PC 명함 위치 제어] */
            .business-card { 
                position: fixed; 
                top: 65%; /* 처음엔 살짝 아래 */
                left: 40px; 
                transform: translateY(-50%); 
                width: 320px; border: 2px solid #003a78; border-radius: 20px; 
                background: #fff; z-index: 1100; box-shadow: 10px 10px 30px rgba(0,0,0,0.1); 
                transition: all 0.5s ease-out; /* 부드러운 이동을 위한 트랜지션 */
            }
            
            /* 스크롤 시 중앙(50%)으로 이동하는 클래스 */
            .business-card.scrolled {
                top: 50% !important;
            }
            
            .fixed-footer-call { bottom: 40px; right: 40px; left: auto; transform: none; min-width: 250px; }
            
            /* 로고 및 타이틀 독립 배치 */
            .main-title { padding: 80px 40px; min-height: 220px; }
            .main-title .inner-logo { 
                display: block; position: absolute; left: 50px; top: 50%; transform: translateY(-50%);
                height: 160px; z-index: 1;
            } 
            .main-title .inner-logo img { height: 100%; width: auto; }
            .main-title .title-text { position: relative; z-index: 2; }
        }
    </style>
</head>
<body>

    <div class="business-card" id="pcCard">
        <div class="card-container">
            <img src="img/KJJ.JPG" alt="분양상담사 명함">
            <a href="tel:01065966692" class="card-btn-call">📞 김종직 팀장 상담 연결</a>
        </div>
    </div>

    <div class="main-title">
        <div class="inner-logo"><img src="img/logo.png" alt="더샵 로고"></div>
        <div class="title-text">
            <h2>더샵 오산역아크시티</h2>
            <p>세교2지구 유일한 슬세권이 펼쳐지는 오산 최고층 랜드마크 단지</p>
        </div>
    </div>
    
    <div class="point-banner">김종직 팀장: 010-6596-6692</div>

    <div class="tab-menu">
        <button class="tab-btn active" onclick="openTab(event, 'tab1')">사업개요</button>
        <button class="tab-btn" onclick="openTab(event, 'tab2')">입지안내</button>
        <button class="tab-btn" onclick="openTab(event, 'tab3')">단지&세대안내</button>
    </div>

    <div id="tab1" class="tab-content active"><img src="img/full.jpg"><img src="img/2.png"><img src="img/3.png"></div>
    <div id="tab2" class="tab-content"><img src="img/9.png"><img src="img/4.png"></div>
    <div id="tab3" class="tab-content">세대 정보 영역</div>

    <a href="tel:01065966692" class="fixed-footer-call">📞 김종직 팀장 상담 연결</a>

    <script>
        window.onscroll = function() {
            var scrollPos = window.pageYOffset || document.documentElement.scrollTop;
            var pcCard = document.getElementById('pcCard');
            
            // 1. 명함 위치 제어 (PC 전용)
            if (window.innerWidth >= 1024) {
                if (scrollPos > 100) {
                    pcCard.classList.add('scrolled');
                } else {
                    pcCard.classList.remove('scrolled');
                }
            }

            // 2. 기존 필터 투명 로직
            var filters = document.querySelectorAll('.size-filter, .type-group.active');
            filters.forEach(function(el) {
                if (scrollPos > 400) { el.classList.add('scrolled'); } 
                else { el.classList.remove('scrolled'); }
            });
        };

        function openTab(evt, tabName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tab-content");
            for (i = 0; i < tabcontent.length; i++) { tabcontent[i].classList.remove("active"); }
            tablinks = document.getElementsByClassName("tab-btn");
            for (i = 0; i < tablinks.length; i++) { tablinks[i].classList.remove("active"); }
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
            window.scrollTo({top: 0, behavior: 'smooth'});
        }
    </script>
</body>
</html>
