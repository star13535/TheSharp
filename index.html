<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>더샵 오산역아크시티 - 김종직 팀장</title>
    
    <link rel="icon" href="img/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">

    <style>
        /* [공통 설정] */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8f9fa; text-align: center; padding-bottom: 100px; }
        img { width: 100%; height: auto; display: block; vertical-align: middle; }

        /* [1. 명함 섹션] */
        .business-card { width: 100%; background: #fff; padding: 30px 20px; border-bottom: 1px solid #eee; }
        .card-container { width: 100%; max-width: 330px; margin: 0 auto; }
        .card-container img { border-radius: 12px; box-shadow: 0 6px 15px rgba(0,0,0,0.1); }
        .card-btn-call { display: block; margin-top: 15px; padding: 12px 0; background: #003a78; color: #fff; text-decoration: none; border-radius: 8px; font-size: 16px; font-weight: bold; }

        /* [2. 타이틀 & 배너] */
        .main-title { background-color: #fff; padding: 40px 20px; }
        .main-title h2 { font-size: 36px; color: #003a78; font-weight: 700; letter-spacing: -1.5px; line-height: 1.2; word-break: keep-all; }
        .main-title p { font-size: 19px; color: #666; margin-top: 12px; }
        .point-banner { background: #003a78; color: #fff; padding: 15px; font-size: 20px; font-weight: bold; }

        /* [3. 메인 탭 메뉴 - 고정] */
        .tab-menu { 
            display: flex; flex-wrap: wrap; justify-content: center; background: #fff; 
            position: sticky; top: 0; z-index: 2000; border-bottom: 2px solid #003a78; 
        }
        .tab-btn { flex: 1; min-width: 20%; padding: 15px 5px; border: none; background: #fff; font-size: 16px; font-weight: bold; color: #666; cursor: pointer; border-right: 1px solid #eee; }
        .tab-btn.active { background: #003a78; color: #fff; }

        /* [4. 탭 콘텐츠 공통] */
        .tab-content { display: none; width: 100%; max-width: 1100px; margin: 0 auto; background: #fff; }
        .tab-content.active { display: block !important; }

        /* [5. 세대안내 내부 스타일 - 고정] */
        .view-mode-selector { 
            display: flex; background: #eee; margin: 0; padding: 10px; 
            position: sticky; top: 52px; z-index: 1500; border-bottom: 1px solid #ddd;
        }
        .mode-btn { flex: 1; padding: 12px; border: none; background: #ddd; font-weight: bold; color: #888; cursor: pointer; border-radius: 6px; margin: 0 5px; }
        .mode-btn.active { background: #fff; color: #003a78; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        .mode-content, .sub-tab-content { display: none; }
        .mode-content.active, .sub-tab-content.active { display: block !important; }

        /* [6. 서브 필터 및 메뉴 - 스크롤에 따라 도화지 사라짐 효과] */
        .size-filter, .type-group.active { 
            position: sticky; top: 120px; z-index: 1000; 
            background: #fff; /* 처음엔 도화지(흰 배경) 있음 */
            border-bottom: 1px solid #eee;
            transition: all 0.3s ease; /* 부드러운 변화 */
        }

        /* 스크롤 되었을 때 적용될 클래스 */
        .size-filter.scrolled, .type-group.active.scrolled { 
            background: transparent !important; 
            border-bottom: none !important;
            box-shadow: none;
        }

        .size-filter { 
            display: flex; justify-content: center; gap: 8px; padding: 15px 10px; 
            overflow-x: auto; scrollbar-width: none;
        }
        .size-filter::-webkit-scrollbar { display: none; }

        #plan-view .type-group.active { top: 180px; }
        #plan-view .type-group.active.scrolled { top: 175px; }

        .filter-btn { 
            flex: 0 0 auto; min-width: 95px; padding: 10px 12px; border: 1px solid #003a78; 
            background: #fff; color: #003a78; border-radius: 4px; font-weight: bold; cursor: pointer; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .filter-btn.active { background: #003a78; color: #fff; }

        .type-group { display: none; padding: 15px 10px; text-align: center; }
        #photo-view .type-group.active { display: block !important; }

        /* 서브 버튼 디자인 */
        .sub-tab-menu { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .sub-tab-btn { 
            padding: 8px 5px; min-width: auto; border: none; 
            background: none; font-size: 15px; font-weight: bold; color: #777; 
            cursor: pointer; white-space: nowrap; transition: all 0.2s;
        }
        .sub-tab-btn.active { 
            color: #003a78; border-bottom: 3px solid #003a78; border-radius: 0; 
        }
        /* 스크롤 중일 때 버튼 가독성을 위해 흰색 테두리 효과 살짝 추가 */
        .scrolled .sub-tab-btn { text-shadow: 0px 0px 5px #fff; }

        /* [7. 하단 고정 버튼] */
        .fixed-footer-call {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            width: auto; min-width: 300px;
            background: linear-gradient(90deg, #003a78, #0056b3);
            color: #fff; text-decoration: none; padding: 14px 30px;
            font-size: 18px; font-weight: bold; z-index: 9999;
            text-align: center; border-radius: 50px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            transition: all 0.3s ease;
        }

        @media (min-width: 1024px) {
            body { padding-bottom: 0; }
            .business-card { 
                position: fixed; top: 50%; left: 40px; transform: translateY(-50%); 
                width: 320px; border: 2px solid #003a78; border-radius: 20px; 
                z-index: 1100; box-shadow: 10px 10px 30px rgba(0,0,0,0.15); 
            }
            .fixed-footer-call { bottom: 40px; right: 40px; left: auto; transform: none; min-width: 250px; }
        }
    </style>
</head>
<body>

    <div class="business-card">
        <div class="card-container">
            <img src="img/logo3.png" alt="분양상담사 명함">
            <a href="tel:01065966692" class="card-btn-call">📞 상담 바로 연결</a>
        </div>
    </div>

    <div class="main-title">
        <h2>더샵 오산역아크시티</h2>
        <p>세교2지구 유일한 슬세권이 펼쳐지는 오산 최고층 랜드마크 단지</p>
    </div>

    <div class="point-banner">김종직 팀장: 010-6596-6692</div>

    <div class="tab-menu">
        <button class="tab-btn active" onclick="openTab(event, 'tab1')">사업개요</button>
        <button class="tab-btn" onclick="openTab(event, 'tab2')">입지안내</button>
        <button class="tab-btn" onclick="openTab(event, 'tab3')">단지&세대안내</button>
    </div>

    <div id="tab1" class="tab-content active">
        <img src="img/full.jpg"><img src="img/2.png"><img src="img/3.png"><img src="img/4.png"><img src="img/9.png">
    </div>

    <div id="tab2" class="tab-content">
        <img src="img/9.png"><img src="img/4.png"><img src="img/5.png"><img src="img/6.png"><img src="img/7.png"><img src="img/8.png">
    </div>

    <div id="tab3" class="tab-content">
        <div class="view-mode-selector">
            <button class="mode-btn active" onclick="changeViewMode(event, 'photo-view')">🏢 단지 안내</button>
            <button class="mode-btn" onclick="changeViewMode(event, 'plan-view')">🏠 평면도 안내</button>
        </div>

        <div id="photo-view" class="mode-content active">
            <div class="type-group active">
                <div class="sub-tab-menu">
                    <button class="sub-tab-btn active" onclick="openSubTab(event, 'danji1', 'photo-view')">투시도/조감도</button>
                    <button class="sub-tab-btn" onclick="openSubTab(event, 'danji2', 'photo-view')">단지/동호수 배치도</button>
                    <button class="sub-tab-btn" onclick="openSubTab(event, 'danji3', 'photo-view')">커뮤니티</button>
                </div>
            </div>
            <div id="danji1" class="sub-tab-content active"><img src="img/full.jpg"><img src="img/full2.jpg"><img src="img/full3.jpg"></div>
            <div id="danji2" class="sub-tab-content"><img src="img/15.png"><img src="img/donghosu.jpg"></div>
            <div id="danji3" class="sub-tab-content"><img src="img/26.png"></div>
        </div>
        
        <div id="plan-view" class="mode-content">
            <div class="size-filter">
                <button class="filter-btn active" onclick="filterSize(event, 'size84A')">84㎡A,A-1</button>
                <button class="filter-btn" onclick="filterSize(event, 'size84B')">84㎡B,B-1</button>
                <button class="filter-btn" onclick="filterSize(event, 'size104')">104㎡A</button>
            </div>
            <div id="size84A" class="type-group active">
                <div class="sub-tab-menu"><button class="sub-tab-btn active" onclick="openSubTab(event, 'type84A', 'plan-view')">84㎡A,A-1 보기</button></div>
            </div>
            <div id="size84B" class="type-group">
                <div class="sub-tab-menu"><button class="sub-tab-btn" onclick="openSubTab(event, 'type84B', 'plan-view')">84㎡B,B-1 보기</button></div>
            </div>
            <div id="size104" class="type-group">
                <div class="sub-tab-menu"><button class="sub-tab-btn" onclick="openSubTab(event, 'type104', 'plan-view')">104㎡A 보기</button></div>
            </div>
            <div id="type84A" class="sub-tab-content active"><img src="img/84.jpg"></div>
            <div id="type84B" class="sub-tab-content"><img src="img/84B.jpg"></div>
            <div id="type104" class="sub-tab-content"><img src="img/104a.jpg"></div>
        </div>
    </div>

    <a href="tel:01065966692" class="fixed-footer-call">📞 김종직 팀장 상담 연결</a>

    <script>
        // 스크롤 감지 및 도화지 제거 스크립트 추가
        window.onscroll = function() {
            var scrollPos = window.pageYOffset || document.documentElement.scrollTop;
            var filters = document.querySelectorAll('.size-filter, .type-group.active');
            
            filters.forEach(function(el) {
                // 특정 높이(예: 300px) 이상 내려가면 배경 제거
                if (scrollPos > 400) {
                    el.classList.add('scrolled');
                } else {
                    el.classList.remove('scrolled');
                }
            });
        };

        function openTab(evt, tabName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tab-content");
            for (i = 0; i < tabcontent.length; i++) { tabcontent[i].classList.remove("active"); }
            tablinks = document.getElementsByClassName("tab-btn");
            for (i = 0; i < tablinks.length; i++) { tablinks[i].classList.remove("active"); }
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
            
            if(tabName === 'tab3') {
                changeViewMode(null, 'photo-view');
            }
            window.scrollTo(0, 0);
        }

        function changeViewMode(evt, modeId) {
            const contents = document.getElementsByClassName('mode-content');
            for (let content of contents) { content.classList.remove('active'); }
            const btns = document.getElementsByClassName('mode-btn');
            for (let btn of btns) { btn.classList.remove('active'); }
            
            const target = document.getElementById(modeId);
            target.classList.add('active');
            
            if(evt) {
                evt.currentTarget.classList.add('active');
            } else {
                document.querySelector('.mode-btn').classList.add('active');
            }

            if(modeId === 'photo-view') {
                const firstSubBtn = document.querySelector('#photo-view .sub-tab-btn');
                if(firstSubBtn) firstSubBtn.click();
            } else if(modeId === 'plan-view') {
                const firstFilterBtn = document.querySelector('.filter-btn');
                if(firstFilterBtn) firstFilterBtn.click();
            }
        }

        function filterSize(evt, sizeId) {
            const groups = document.querySelectorAll('#plan-view .type-group');
            for (let group of groups) { group.classList.remove('active'); }
            const filterBtns = document.getElementsByClassName('filter-btn');
            for (let btn of filterBtns) { btn.classList.remove('active'); }
            
            const target = document.getElementById(sizeId);
            target.classList.add('active');
            evt.currentTarget.classList.add('active');
            
            const firstSubBtn = target.querySelector('.sub-tab-btn');
            if(firstSubBtn) firstSubBtn.click();
        }

        function openSubTab(evt, subTabName, parentModeId) {
            const parent = document.getElementById(parentModeId);
            const subcontents = parent.getElementsByClassName("sub-tab-content");
            for (let content of subcontents) { content.classList.remove("active"); }
            const subbtns = parent.getElementsByClassName("sub-tab-btn");
            for (let btn of subbtns) { btn.classList.remove("active"); }
            
            const target = document.getElementById(subTabName);
            target.classList.add("active");
            evt.currentTarget.classList.add("active");
        }
    </script>
</body>
</html>
