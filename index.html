<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>더샵 오산역아크시티 - 김종직 팀장</title>
    
    <link rel="icon" href="img/logo3.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">

    <style>
        /* [기본 스타일] */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8f9fa; color: #333; text-align: center; padding-bottom: 100px; }
        img { width: 100%; height: auto; display: block; vertical-align: middle; }

        /* [1. 팝업] */
        .intro-popup-container { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; 
            background: rgba(0, 0, 0, 0.75); z-index: 10000; align-items: center; justify-content: center; padding: 15px;
        }
        .intro-popup-content { position: relative; width: 95%; max-width: 450px; animation: fadeInScale 0.6s ease-out; }
        @keyframes fadeInScale { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .intro-popup-content img { border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .pop-close-x { 
            position: absolute; top: 15px; right: 15px; width: 30px; height: 30px; 
            cursor: pointer; background: rgba(0,0,0,0.5); border-radius: 50%; color: #fff; 
            line-height: 30px; font-weight: bold; font-style: normal;
        }

        /* [2. 명함] */
        .business-card { width: 100%; background: #fff; padding: 30px 20px; border-bottom: 1px solid #eee; }
        .card-container { width: 100%; max-width: 330px; margin: 0 auto; }
        .card-container img { border-radius: 12px; box-shadow: 0 6px 15px rgba(0,0,0,0.1); }
        .card-btn-call { display: block; margin-top: 15px; padding: 12px 0; background: #003a78; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; }

        /* [3. 로고 & 타이틀] */
        .main-title { background-color: #fff; padding: 50px 20px; position: relative; display: flex; align-items: center; justify-content: center; min-height: 180px; }
        .main-title .inner-logo { display: none; }
        .main-title h2 { font-size: 36px; color: #003a78; font-weight: 700; letter-spacing: -1.5px; }
        .main-title p { font-size: 19px; color: #666; margin-top: 12px; }
        .point-banner { background: #003a78; color: #fff; padding: 15px; font-size: 20px; font-weight: bold; }

        /* [4. 탭 메뉴] */
        .tab-menu { 
            display: flex; flex-wrap: wrap; justify-content: center; background: #fff; 
            position: sticky; top: 0; z-index: 2000; border-bottom: 2px solid #003a78; 
        }
        .tab-btn { flex: 1; min-width: 20%; padding: 15px 5px; border: none; background: #fff; font-size: 16px; font-weight: bold; color: #666; cursor: pointer; border-right: 1px solid #eee; }
        .tab-btn.active { background: #003a78; color: #fff; }

        /* [5. 탭3 & 필터] */
        .tab-content { display: none; width: 100%; max-width: 1100px; margin: 0 auto; background: #fff; }
        .tab-content.active { display: block !important; }
        .view-mode-selector { display: flex; background: #eee; padding: 10px; position: sticky; top: 52px; z-index: 1500; border-bottom: 1px solid #ddd; }
        .mode-btn { flex: 1; padding: 12px; border: none; background: #ddd; font-weight: bold; color: #888; cursor: pointer; border-radius: 6px; margin: 0 5px; }
        .mode-btn.active { background: #003a78; color: #fff; }
        .mode-content, .sub-tab-content { display: none; }
        .mode-content.active, .sub-tab-content.active { display: block !important; }

        .size-filter, .type-group.active { position: sticky; top: 120px; z-index: 1000; background: #fff; border-bottom: 1px solid #eee; }
        .size-filter { display: flex; justify-content: center; gap: 8px; padding: 15px 10px; overflow-x: auto; scrollbar-width: none; }
        .filter-btn, .sub-tab-btn { flex: 0 0 auto; min-width: 95px; padding: 10px 15px; border: 1px solid #003a78; background: #fff; color: #003a78; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .filter-btn.active, .sub-tab-btn.active { background: #003a78 !important; color: #fff !important; }
        .type-group { display: none; padding: 15px 10px; text-align: center; }
        #photo-view .type-group.active { display: block !important; }
        .sub-tab-menu { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }

        /* [PC 전용] */
        @media (min-width: 1024px) {
            .business-card { position: fixed; top: 65%; left: 40px; transform: translateY(-50%); width: 320px; border: 2px solid #003a78; border-radius: 20px; background: #fff; z-index: 1100; transition: all 0.5s ease-out; }
            .business-card.scrolled { top: 50% !important; }
            .main-title .inner-logo { display: block; position: absolute; left: 50px; top: 50%; transform: translateY(-50%); height: 160px; z-index: 1; }
            .main-title .inner-logo img { height: 100%; width: auto; }
        }

        .fixed-footer-call { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); min-width: 300px; background: #003a78; color: #fff; text-decoration: none; padding: 14px 30px; border-radius: 50px; font-weight: bold; z-index: 9999; }
    </style>
</head>
<body>

    <div class="intro-popup-container" id="introPopup">
        <div class="intro-popup-content">
            <i class="pop-close-x" id="popClose">X</i>
            <img src="img/popup.jpg" alt="광고">
        </div>
    </div>

    <div class="business-card" id="pcCard">
        <div class="card-container">
            <img src="img/KJJ.JPG" alt="명함">
            <a href="tel:01065966692" class="card-btn-call">📞 김종직 팀장 상담 연결</a>
        </div>
    </div>

    <div class="main-title">
        <div class="inner-logo"><img src="img/logo3.png" alt="로고"></div>
        <div class="title-text">
            <h2>더샵 오산역아크시티</h2>
            <p>세교2지구 유일한 슬세권 랜드마크</p>
        </div>
    </div>
    
    <div class="point-banner" id="scrollPoint">김종직 팀장: 010-6596-6692</div>

    <div class="tab-menu" id="mainTabMenu">
        <button class="tab-btn active" onclick="openTab(event, 'tab1')">사업개요</button>
        <button class="tab-btn" onclick="openTab(event, 'tab2')">입지안내</button>
        <button class="tab-btn" onclick="openTab(event, 'tab3')">단지&세대안내</button>
    </div>

    <div id="tab1" class="tab-content active"><img src="img/full.jpg"><img src="img/2.png"></div>
    <div id="tab2" class="tab-content"><img src="img/9.png"><img src="img/4.png"></div>
    
    <div id="tab3" class="tab-content">
        <div class="view-mode-selector">
            <button class="mode-btn active" onclick="changeViewMode(event, 'photo-view')">🏢 단지 안내</button>
            <button class="mode-btn" onclick="changeViewMode(event, 'plan-view')">🏠 평면도 안내</button>
        </div>
        
        <div id="photo-view" class="mode-content active">
            <div class="type-group active"><div class="sub-tab-menu">
                <button class="sub-tab-btn active" onclick="openSubTab(event, 'danji1', 'photo-view')">조감도</button>
                <button class="sub-tab-btn" onclick="openSubTab(event, 'danji2', 'photo-view')">배치도</button>
            </div></div>
            <div id="danji1" class="sub-tab-content active"><img src="img/full.jpg"></div>
            <div id="danji2" class="sub-tab-content"><img src="img/15.png"></div>
        </div>

        <div id="plan-view" class="mode-content">
            <div class="size-filter">
                <button class="filter-btn active" onclick="filterSize(event, 'size84A')">84A</button>
                <button class="filter-btn" onclick="filterSize(event, 'size84B')">84B</button>
            </div>
            <div id="size84A" class="type-group active"><div class="sub-tab-menu"><button class="sub-tab-btn active" onclick="openSubTab(event, 'type84A', 'plan-view')">84A 보기</button></div></div>
            <div id="size84B" class="type-group"><div class="sub-tab-menu"><button class="sub-tab-btn" onclick="openSubTab(event, 'type84B', 'plan-view')">84B 보기</button></div></div>
            <div id="type84A" class="sub-tab-content active"><img src="img/84.jpg"></div>
            <div id="type84B" class="sub-tab-content"><img src="img/84B.jpg"></div>
        </div>
    </div>

    <a href="tel:01065966692" class="fixed-footer-call">📞 김종직 팀장 상담 연결</a>

    <script>
        // [핵심] 탭 메뉴 바로 아래(이미지 시작점)로 스크롤 이동
        function scrollToContent() {
            const menu = document.getElementById('mainTabMenu');
            const offset = menu.offsetTop;
            window.scrollTo({ top: offset, behavior: 'smooth' });
        }

        window.addEventListener('DOMContentLoaded', function() {
            const pop = document.getElementById('introPopup');
            pop.style.display = 'flex';
            document.getElementById('popClose').onclick = () => { pop.style.display = 'none'; };
            
            window.onscroll = function() {
                let s = window.pageYOffset || document.documentElement.scrollTop;
                const pcCard = document.getElementById('pcCard');
                if (window.innerWidth >= 1024) {
                    if (s > 100) pcCard.classList.add('scrolled');
                    else pcCard.classList.remove('scrolled');
                }
            };
        });

        function openTab(e, t) {
            document.querySelectorAll(".tab-content, .tab-btn").forEach(x => x.classList.remove("active"));
            document.getElementById(t).classList.add("active");
            e.currentTarget.classList.add("active");
            scrollToContent();
        }

        function changeViewMode(e, m) {
            document.querySelectorAll('.mode-content, .mode-btn').forEach(x => x.classList.remove('active'));
            document.getElementById(m).classList.add('active');
            e.currentTarget.classList.add('active');
            scrollToContent();
            if(m === 'photo-view') document.querySelector('#photo-view .sub-tab-btn').click();
            else document.querySelector('.filter-btn').click();
        }

        function filterSize(e, s) {
            document.querySelectorAll('#plan-view .type-group, .filter-btn').forEach(x => x.classList.remove('active'));
            document.getElementById(s).classList.add('active');
            e.currentTarget.classList.add('active');
            scrollToContent();
            document.getElementById(s).querySelector('.sub-tab-btn').click();
        }

        function openSubTab(e, s, p) {
            const parent = document.getElementById(p);
            parent.querySelectorAll(".sub-tab-content, .sub-tab-btn").forEach(x => x.classList.remove("active"));
            document.getElementById(s).classList.add("active");
            e.currentTarget.classList.add("active");
            scrollToContent();
        }
    </script>
</body>
</html>
